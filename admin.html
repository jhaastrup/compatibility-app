<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner dashboard</title>
  <meta name="theme-color" content="#1a0a0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Chart colours: validated for colour-blind safety on this dark background
       (blue, orange, teal). Text never uses these; they only colour marks. */
    .admin {
      --series-1: #338ced;
      --series-2: #e76624;
      --series-3: #00a888;
      --series-1-track: rgba(51, 140, 237, 0.22);
      --warning: #fbb315;
      --grid: rgba(255, 255, 255, 0.08);
      --axis: rgba(255, 255, 255, 0.2);
      --up: #7fd1a8;
      --down: #f0a3a9;
      --chart-surface: #2a1a1f;
    }
    .admin .toolbar { margin-bottom: 1.25rem; }
    .admin .updated { font-size: 0.8rem; color: var(--text-muted); }
    .admin #content { transition: opacity 0.2s; }
    .admin #content.refreshing { opacity: 0.55; pointer-events: none; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; }
    @media (max-width: 480px) {
      .kpis { gap: 0.6rem; }
      .admin .kpi { padding: 0.9rem 0.85rem; border-radius: 18px; }
      .kpi-value { font-size: 1.6rem; }
      .kpi-sub, .kpi-delta { font-size: 0.72rem; }
    }
    .kpi { padding: 1.1rem 1.15rem; }
    .kpi + .kpi { margin-top: 0; }
    .kpi-label { font-size: 0.8rem; color: var(--text-secondary); }
    .kpi-value { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 2rem; color: var(--cream); line-height: 1.15; margin: 0.25rem 0 0.35rem; }
    .kpi-sub { font-size: 0.8rem; color: var(--cream-muted); }
    .kpi-delta { font-size: 0.75rem; margin-top: 0.2rem; color: var(--text-muted); }
    .kpi-delta.up { color: var(--up); }
    .kpi-delta.down { color: var(--down); }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; margin-top: 1.25rem; }
    .grid-2 > .panel + .panel { margin-top: 0; }
    .block { margin-top: 1.25rem; }
    .panel h2 { font-family: 'Inter', sans-serif; font-size: 1.05rem; font-weight: 600; }
    .panel .panel-sub { margin-bottom: 1rem; font-size: 0.85rem; }

    /* Line chart */
    .legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; margin-bottom: 0.75rem; font-size: 0.8rem; color: var(--text-secondary); }
    .legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
    .legend i { display: inline-block; width: 16px; height: 2px; border-radius: 2px; }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; overflow: visible; }
    .chart .hit { cursor: crosshair; outline: none; }
    .chart .hit:focus-visible { stroke: var(--rose-light); stroke-width: 1; }
    .tip { position: absolute; top: 0; pointer-events: none; background: rgba(26, 10, 14, 0.96); border: 1px solid var(--glass-border); border-radius: 12px; padding: 0.55rem 0.75rem; font-size: 0.78rem; color: var(--text-secondary); box-shadow: 0 10px 30px rgba(0,0,0,0.4); min-width: 140px; z-index: 2; }
    .tip .tip-day { color: var(--cream-muted); margin-bottom: 0.3rem; font-weight: 500; }
    .tip .tip-row { display: flex; align-items: center; gap: 0.5rem; line-height: 1.6; }
    .tip .tip-row i { width: 12px; height: 2px; border-radius: 2px; flex-shrink: 0; }
    .tip .tip-row b { color: var(--cream); font-weight: 600; min-width: 1.6rem; font-variant-numeric: tabular-nums; }
    .table-toggle { margin-top: 0.9rem; }
    .table-toggle summary { cursor: pointer; font-size: 0.8rem; color: var(--rose-light); }
    .table-wrap { overflow-x: auto; margin-top: 0.6rem; max-height: 320px; overflow-y: auto; }

    /* Bar lists */
    .bars { display: flex; flex-direction: column; gap: 0.8rem; }
    .bar-row { display: grid; grid-template-columns: minmax(96px, 34%) 1fr; gap: 0.35rem 0.9rem; align-items: center; }
    .bar-name { font-size: 0.85rem; color: var(--cream-muted); line-height: 1.3; }
    .bar-name small { display: block; color: var(--text-muted); font-size: 0.74rem; }
    /* The track leaves room on the right so the value can sit at the bar's tip. */
    .bar-track { display: flex; align-items: center; gap: 0.5rem; width: calc(100% - 3.5rem); }
    .bar { flex: none; height: 12px; border-radius: 0 4px 4px 0; background: var(--series-1); transition: filter 0.2s; }
    .bar-row:hover .bar { filter: brightness(1.2); }
    .bar-val { flex: none; font-size: 0.85rem; color: var(--cream); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    @media (max-width: 480px) {
      .bar-row { grid-template-columns: 1fr; }
    }

    /* Meter */
    .meter { height: 10px; border-radius: 100px; background: var(--series-1-track); overflow: hidden; margin: 0.5rem 0 0.4rem; }
    .meter > div { height: 100%; border-radius: 100px; background: var(--series-1); }
    .meter.warn > div { background: var(--warning); }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-top: 1.1rem; }
    .fact { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 0.75rem 0.9rem; }
    .fact b { display: block; font-size: 1.25rem; font-weight: 600; color: var(--cream); }
    .fact span { font-size: 0.75rem; color: var(--text-muted); }
    .callout { margin-top: 1rem; }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .data-table th, .data-table td { padding: 0.55rem 0.6rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
    .data-table th:first-child, .data-table td:first-child { text-align: left; }
    .data-table th { color: var(--text-muted); font-weight: 500; font-size: 0.75rem; position: sticky; top: 0; background: #241318; }
    .data-table td { color: var(--cream-muted); font-variant-numeric: tabular-nums; }
    .data-table td a { color: var(--cream); text-decoration: none; }
    .data-table td a:hover { text-decoration: underline; }
    .data-table td small { display: block; color: var(--text-muted); font-size: 0.72rem; }
    .empty-note { font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="shell admin">
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="/dashboard.html"><span data-app-name>Compatible</span></a>
        <div class="top-actions">
          <a class="btn btn-ghost btn-sm" href="/dashboard.html">&larr; Dashboard</a>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="wrap">
        <div class="page-head">
          <div>
            <h1>Owner dashboard</h1>
            <p>Totals across everyone using the app. No names, emails, handles or answers.</p>
          </div>
        </div>

        <div class="toolbar" id="toolbar" hidden>
          <div class="seg" role="group" aria-label="Period">
            <button type="button" data-days="7" aria-pressed="false">Last 7 days</button>
            <button type="button" data-days="30" aria-pressed="true">Last 30 days</button>
            <button type="button" data-days="90" aria-pressed="false">Last 90 days</button>
          </div>
          <div style="display:flex; align-items:center; gap:0.75rem">
            <span class="updated" id="updated"></span>
            <button type="button" class="btn btn-secondary btn-sm" id="refresh">Refresh</button>
          </div>
        </div>

        <div id="content"><div class="spinner" role="status" aria-label="Loading"></div></div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
