<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Are you a match? &mdash; Compatibility quiz</title>
  <meta name="description" content="Take a quick compatibility quiz and find out if you're a match.">
  <meta property="og:title" content="Are you a match? Take my compatibility quiz">
  <meta property="og:description" content="A few honest questions. If we match, you can leave your IG or X handle.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1a0a0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .back-btn { position: absolute; top: 1.1rem; left: 1.1rem; }
    .common-list { list-style: none; text-align: left; display: flex; flex-direction: column; gap: 0.5rem; margin: 0 0 1.75rem; }
    .common-list li { display: flex; gap: 0.6rem; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.45; }
    .common-list li::before { content: '\2713'; color: var(--success); font-weight: 700; flex-shrink: 0; }
    .age-input { text-align: center; font-size: 1.5rem; max-width: 180px; margin: 0 auto; }
    .made-with { margin-top: 1.75rem; }
    .dial { flex: 0 0 42%; }
    .seg.grid2 { display: grid; grid-template-columns: 1fr 1fr; border-radius: 18px; }
    .seg.grid2 button { border-radius: 14px; }
    .handle-input { display: flex; align-items: center; border: 1px solid var(--glass-border); border-radius: 14px; background: rgba(255,255,255,0.06); transition: border-color 0.3s, box-shadow 0.3s; }
    .handle-input:focus-within { border-color: var(--rose-primary); box-shadow: 0 0 0 3px rgba(196, 97, 108, 0.2); }
    .handle-input.invalid { border-color: var(--danger); }
    .handle-input span { padding-left: 1.1rem; color: var(--text-muted); font-size: 0.95rem; }
    .handle-input .input { border: 0; background: transparent; box-shadow: none !important; padding-left: 0.3rem; }
  </style>
</head>
<body class="center">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main id="app" class="card" aria-live="polite">
    <div class="spinner" role="status" aria-label="Loading"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module" src="/js/quiz.js"></script>
</body>
</html>
